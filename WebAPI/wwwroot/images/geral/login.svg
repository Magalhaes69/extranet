<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Cliente a usar o portal: encomendas, faturas e pagamentos num só lugar">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a500" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f0a500" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft glow behind the scene -->
  <circle cx="300" cy="260" r="240" fill="url(#glow)"/>

  <!-- floor shadow -->
  <ellipse cx="330" cy="520" rx="250" ry="16" fill="#000" opacity=".25"/>

  <!-- ============ Monitor ============ -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="390" height="270" rx="18" fill="#ffffff"/>
  </g>
  <!-- window bar -->
  <rect x="60" y="110" width="390" height="34" rx="18" fill="#eef2f6"/>
  <rect x="60" y="128" width="390" height="16" fill="#eef2f6"/>
  <circle cx="84" cy="127" r="5" fill="#f87171"/>
  <circle cx="100" cy="127" r="5" fill="#fbbf24"/>
  <circle cx="116" cy="127" r="5" fill="#34d399"/>

  <!-- sidebar -->
  <rect x="60" y="144" width="70" height="236" fill="#1f2933"/>
  <rect x="60" y="364" width="70" height="16" fill="#1f2933"/>
  <rect x="78" y="164" width="34" height="8" rx="4" fill="#f0a500"/>
  <rect x="78" y="186" width="34" height="6" rx="3" fill="#52606d"/>
  <rect x="78" y="204" width="34" height="6" rx="3" fill="#52606d"/>
  <rect x="78" y="222" width="34" height="6" rx="3" fill="#52606d"/>
  <rect x="78" y="240" width="34" height="6" rx="3" fill="#52606d"/>

  <!-- KPI cards -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="146" y="160" width="88" height="62" rx="10" fill="#fff7e0" stroke="#f6dfa0"/>
    <rect x="156" y="172" width="40" height="6" rx="3" fill="#c98a00"/>
    <text x="156" y="208" font-size="22" font-weight="700" fill="#1f2933">12</text>

    <rect x="244" y="160" width="88" height="62" rx="10" fill="#eaf3ff" stroke="#c7ddfb"/>
    <rect x="254" y="172" width="40" height="6" rx="3" fill="#2f6fd6"/>
    <text x="254" y="208" font-size="22" font-weight="700" fill="#1f2933">4</text>

    <rect x="342" y="160" width="92" height="62" rx="10" fill="#e9f8ef" stroke="#c4ead3"/>
    <rect x="352" y="172" width="40" height="6" rx="3" fill="#1f9d55"/>
    <text x="352" y="208" font-size="22" font-weight="700" fill="#1f2933">98%</text>
  </g>

  <!-- bar chart -->
  <rect x="146" y="236" width="288" height="128" rx="10" fill="#f8fafc" stroke="#e4e9f0"/>
  <g fill="#f0a500">
    <rect x="168" y="314" width="22" height="34" rx="4" opacity=".55"/>
    <rect x="202" y="296" width="22" height="52" rx="4" opacity=".7"/>
    <rect x="236" y="306" width="22" height="42" rx="4" opacity=".6"/>
    <rect x="270" y="280" width="22" height="68" rx="4" opacity=".85"/>
    <rect x="304" y="290" width="22" height="58" rx="4" opacity=".75"/>
    <rect x="338" y="264" width="22" height="84" rx="4"/>
    <rect x="372" y="272" width="22" height="76" rx="4" opacity=".9"/>
  </g>
  <polyline points="179,300 213,284 247,292 281,266 315,276 349,250 383,258" fill="none" stroke="#1f2933" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>

  <!-- stand -->
  <rect x="232" y="380" width="46" height="70" fill="#cbd5e1"/>
  <rect x="190" y="446" width="130" height="14" rx="7" fill="#94a3b8"/>

  <!-- ============ Person (facing left, towards the screen / form) ============ -->
  <g>
    <!-- legs -->
    <rect x="502" y="390" width="26" height="124" rx="12" fill="#243b53"/>
    <rect x="534" y="390" width="26" height="124" rx="12" fill="#1c2f44"/>
    <!-- shoes -->
    <path d="M490 506 h40 a8 8 0 0 1 0 16 h-48 a8 8 0 0 1 8 -16z" fill="#102a43"/>
    <path d="M522 506 h40 a8 8 0 0 1 0 16 h-48 a8 8 0 0 1 8 -16z" fill="#0b1f33"/>

    <!-- back arm (relaxed) -->
    <rect x="556" y="270" width="22" height="104" rx="11" fill="#d48f00"/>
    <circle cx="567" cy="378" r="11" fill="#a86b3c"/>

    <!-- torso -->
    <path d="M494 282 q0 -42 42 -42 h6 q42 0 42 42 v116 q0 10 -10 10 h-70 q-10 0 -10 -10z" fill="#f0a500"/>
    <!-- collar -->
    <path d="M522 242 l17 22 l17 -22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>

    <!-- front arm pointing left at the screen -->
    <g transform="rotate(-18 506 270)">
      <rect x="400" y="258" width="112" height="24" rx="12" fill="#f0a500"/>
    </g>
    <circle cx="398" cy="300" r="13" fill="#a86b3c"/>
    <!-- pointing finger -->
    <rect x="374" y="296" width="22" height="8" rx="4" fill="#a86b3c" transform="rotate(-18 385 300)"/>

    <!-- neck -->
    <rect x="528" y="214" width="20" height="30" rx="8" fill="#93592f"/>

    <!-- head (profile, facing left) -->
    <circle cx="536" cy="184" r="40" fill="#a86b3c"/>
    <!-- nose -->
    <path d="M497 184 q-10 8 2 14" fill="#a86b3c"/>
    <!-- eye -->
    <circle cx="514" cy="178" r="4" fill="#1f2933"/>
    <!-- smile -->
    <path d="M506 200 q8 8 18 2" fill="none" stroke="#5c3317" stroke-width="3" stroke-linecap="round"/>
    <!-- hair (on the back of the head, the right side) -->
    <path d="M496 172 q0 -52 46 -52 q44 0 44 48 q0 26 -14 40 q-2 -30 -20 -40 q-26 -6 -56 4z" fill="#4a2a17"/>
    <!-- ear -->
    <ellipse cx="552" cy="188" rx="7" ry="10" fill="#93592f"/>
  </g>

  <!-- ============ Floating cards (lean out towards the form) ============ -->
  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <!-- order created -->
    <rect x="8" y="40" width="226" height="62" rx="14" fill="#ffffff"/>
    <circle cx="40" cy="71" r="16" fill="#e9f8ef"/>
    <path d="M32 71 l6 6 l11 -12" fill="none" stroke="#1f9d55" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="66" font-size="14" font-weight="700" fill="#1f2933">Encomenda criada</text>
    <text x="66" y="86" font-size="12" fill="#616e7c">Nº 1024 · há 2 min</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <!-- invoice paid -->
    <rect x="0" y="400" width="236" height="62" rx="14" fill="#ffffff"/>
    <circle cx="32" cy="431" r="16" fill="#fff7e0"/>
    <rect x="25" y="422" width="14" height="18" rx="2" fill="none" stroke="#c98a00" stroke-width="2.5"/>
    <line x1="28" y1="428" x2="36" y2="428" stroke="#c98a00" stroke-width="2"/>
    <line x1="28" y1="433" x2="36" y2="433" stroke="#c98a00" stroke-width="2"/>
    <text x="58" y="426" font-size="14" font-weight="700" fill="#1f2933">Fatura paga</text>
    <text x="58" y="446" font-size="12" fill="#616e7c">FT 2026/118 · 548,96 MZN</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <!-- 24/7 badge -->
    <rect x="420" y="40" width="150" height="46" rx="23" fill="#1f2933" stroke="#f0a500" stroke-width="2"/>
    <circle cx="446" cy="63" r="6" fill="#34d399"/>
    <text x="460" y="68" font-size="13" font-weight="600" fill="#ffffff">Disponível 24/7</text>
  </g>
</svg>
