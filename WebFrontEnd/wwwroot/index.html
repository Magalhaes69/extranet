    <script>
        const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
        const Default = {
            scrollbarTheme: 'os-theme-light',
            scrollbarAutoHide: 'leave',
            scrollbarClickScroll: true,
        };
        document.addEventListener('DOMContentLoaded', function () {
            const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);

            // Disable OverlayScrollbars on mobile devices to prevent touch interference
            const isMobile = window.innerWidth <= 992;

            if (
                sidebarWrapper &&
                OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
                !isMobile
            ) {
                OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                    scrollbars: {
                        theme: Default.scrollbarTheme,
                        autoHide: Default.scrollbarAutoHide,
                        clickScroll: Default.scrollbarClickScroll,
                    },
                });
            }
        });

        window.initResizableTable = function () {
            const table = document.getElementById("resizable-table");
            if (!table) return;

            let th = null, startX = 0, startWidth = 0, colIndex = 0;

            table.querySelectorAll("th .resizer").forEach(resizer => {
                resizer.addEventListener("mousedown", function (e) {
                    th = e.target.parentElement;
                    startX = e.pageX;
                    startWidth = th.offsetWidth;
                    colIndex = Array.from(th.parentElement.children).indexOf(th);

                    document.addEventListener("mousemove", resize);
                    document.addEventListener("mouseup", stopResize);
                });

                function resize(e) {
                    if (th) {
                        const newWidth = startWidth + (e.pageX - startX);
                        th.style.width = newWidth + "px";

                        // Apply new width to all cells in this column
                        table.querySelectorAll("tr").forEach(row => {
                            const cell = row.children[colIndex];
                            if (cell) cell.style.width = newWidth + "px";
                        });
                    }
                }

                function stopResize() {
                    document.removeEventListener("mousemove", resize);
                    document.removeEventListener("mouseup", stopResize);
                }
            });
        };

    </script>
    <!--end::OverlayScrollbars Configure-->
